name: Handoff Markdown Contract

# HMD-001 (owner decision 2026-10-29). Validates changed handoff artifacts only.
# Does not attest runtime loading, end-of-session persistence or cross-app sync.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-md-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject non-Markdown handoffs
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=AMR", "origin/main...HEAD"],
              text=True,
          ).splitlines()
          errors = []
          checked = []
          for name in changed:
              path = pathlib.Path(name)
              parts = [part.casefold() for part in path.parts]
              if parts[0] == ".github":
                  continue  # Workflow/config files are not handoff artifacts.
              stem = path.stem.casefold()
              in_handoff_dir = any(part in ("handoff", "handoffs") for part in parts[:-1])
              handoff_named = (
                  stem == "handoff"
                  or stem.startswith(("handoff_", "handoff-"))
                  or "_handoff" in stem
                  or "-handoff" in stem
              )
              if not (in_handoff_dir or handoff_named):
                  continue
              checked.append(name)
              if path.suffix != ".md":
                  errors.append(f"{name}: handoff must have lowercase .md extension")
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (OSError, UnicodeError) as exc:
                  errors.append(f"{name}: cannot read UTF-8 Markdown: {exc}")
                  continue
              if not content.strip():
                  errors.append(f"{name}: handoff Markdown is empty")
          for path in checked:
              print(f"CHECKED {path}")
          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print(f"PASS: {len(checked)} changed handoff-related paths checked.")
          print("DOES_NOT_PROVE: every mission generated a handoff or synced Brain/Drive.")
          PY
